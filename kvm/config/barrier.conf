# Barrier Server Configuration for Dual-PC Setup
# Automatically synchronizes Keyboard, Mouse, and Clipboard between Windows Host and Linux Client

section: screens
    # Host Windows Machine (where keyboard and mouse are physically plugged in)
    LAPTOP-JCHTMK43:
        halfDuplexCapsLock = true

    # Linux Client Machine
    aa-MECHREVO:
        halfDuplexCapsLock = true
        halfDuplexNumLock = true
end

section: links
    # Explicit switching via hotkeys below; edge transitions disabled to prevent accidental slips
end

section: options
    relativeMouseMoves = true
    screenSaverSync = false
    win32KeepForeground = true
    clipboardSharing = true
    switchDelay = 0

    # Hotkeys to switch screens seamlessly
    keystroke(Control+Alt+k) = switchToScreen(aa-MECHREVO)
    keystroke(Control+Alt+j) = switchToScreen(LAPTOP-JCHTMK43)
end
